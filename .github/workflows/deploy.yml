name: Deploy

# Builds the images on pushes to master and rolls them out to the VPS
# (compose.prod.yaml) once the VPS_HOST variable is configured.
#
# Repository settings:
#   variables  VPS_HOST         server IP
#              VPS_KNOWN_HOSTS  `ssh-keyscan -t ed25519 <ip>` output
#   secrets    VPS_SSH_KEY      private key of the server's `deploy` user

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [indexer, api, web, mcp]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          # Reproducible images: an app whose inputs didn't change keeps its digest, so
          # compose leaves its containers running.
          SOURCE_DATE_EPOCH: 0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          tags: |
            ghcr.io/daniserrano7/stableflow-${{ matrix.app }}:latest
            ghcr.io/daniserrano7/stableflow-${{ matrix.app }}:${{ github.sha }}
          outputs: type=registry,rewrite-timestamp=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    env:
      SERVER: deploy@${{ vars.VPS_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy the stack definition
        run: |
          ssh "$SERVER" 'mkdir -p /opt/stableflow/caddy'
          scp compose.prod.yaml infra/postgres/roles.sql "$SERVER:/opt/stableflow/"
          scp infra/caddy/Caddyfile "$SERVER:/opt/stableflow/caddy/"

      # The job's token can read the images; the server logs out again once they're pulled.
      - name: Roll out
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$SERVER" 'docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null'
          ssh "$SERVER" 'set -e
            cd /opt/stableflow
            trap "docker logout ghcr.io >/dev/null" EXIT
            docker compose -f compose.prod.yaml pull --quiet
            docker compose -f compose.prod.yaml up -d --remove-orphans
            docker compose -f compose.prod.yaml exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f >/dev/null
            docker compose -f compose.prod.yaml ps --format "table {{.Service}}\t{{.Status}}"'
