# Table and column names match apps/indexer/ponder.schema.ts (snake_case), so SQL that
# reads the Ponder tables keeps working. Ponder's `hex` columns are plain strings here.

type usdc_transfers
  @crossChain
  @index(fields: ["from_address", "block_number"])
  @index(fields: ["to_address", "block_number"]) {
  id: ID!
  chain_id: Int!
  block_number: BigInt! @index
  block_timestamp: BigInt! @index
  transaction_hash: String! @index
  log_index: Int!
  from_address: String!
  to_address: String!
  value: BigInt! @index
}

type usdc_transfer_volume_buckets @crossChain {
  id: ID!
  chain_id: Int!
  token_address: String!
  bucket_size: String!
  bucket_start: BigInt! @index
  transfer_count: BigInt!
  # Sum of every transfer's value; hops inside one transaction are counted each time.
  total_value: BigInt!
  # Value counted once per transaction (see TransactionNetValueTracker).
  adjusted_value: BigInt!
}

