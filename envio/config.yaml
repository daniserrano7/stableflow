# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: stableflow-envio
description: Live USDC flows on Base (HyperIndex port of apps/indexer, the Ponder indexer)
# Single chain; ids stay exactly as in the Ponder indexer.
disable_default_cross_chain: true
contracts:
  - name: BaseUsdc
    events:
      - event: Transfer(address indexed from, address indexed to, uint256 value)
  - name: AcrossSpokePool
    abi_file_path: ./abis/AcrossSpokePool.json
    events:
      - event: V3FundsDeposited
      - event: FilledV3Relay
      - event: FundsDeposited
      - event: FilledRelay
  - name: CircleCctpTokenMessengerV2
    events:
      - event: DepositForBurn(uint64 indexed nonce, address indexed burnToken, uint256 amount, address indexed depositor, bytes32 mintRecipient, uint32 destinationDomain, bytes32 destinationTokenMessenger, bytes32 destinationCaller, uint256 maxFee, uint32 minFinalityThreshold)
  - name: CircleCctpMessageTransmitterV2
    events:
      - event: MessageReceived(address indexed caller, uint32 sourceDomain, bytes32 indexed nonce, bytes32 sender, uint32 indexed finalityThresholdExecuted, bytes messageBody)
  - name: UniswapV3Factory
    events:
      - event: PoolCreated(address indexed token0, address indexed token1, uint24 indexed fee, int24 tickSpacing, address pool)
  - name: PancakeSwapV3Factory
    events:
      - event: PoolCreated(address indexed token0, address indexed token1, uint24 indexed fee, int24 tickSpacing, address pool)
  - name: AerodromePoolFactory
    events:
      - event: PoolCreated(address indexed token0, address indexed token1, bool indexed stable, address pool, uint256 poolIndex)
  - name: AerodromeSlipstreamFactory
    events:
      - event: PoolCreated(address indexed token0, address indexed token1, int24 indexed tickSpacing, address pool)
  - name: AerodromeSlipstream3Factory
    events:
      - event: PoolCreated(address indexed token0, address indexed token1, int24 indexed tickSpacing, address pool)
  - name: AerodromeSlipstreamPoolFactory
    events:
      - event: PoolCreated(address indexed token0, address indexed token1, int24 indexed tickSpacing, address pool)
  - name: MetaMorphoVaultFactory
    events:
      - event: CreateMetaMorpho(address indexed metaMorpho, address indexed caller, address initialOwner, uint256 initialTimelock, address indexed asset, string name, string symbol, bytes32 salt)
chains:
  - id: 8453 # Base
    # Ponder's PONDER_DISCOVERY_START_BLOCK_8453; there is no "latest" here.
    start_block: ${ENVIO_START_BLOCK:-0}
    end_block: ${ENVIO_END_BLOCK:-}
    contracts:
      - name: BaseUsdc
        address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      - name: AcrossSpokePool
        address: "0x09aea4b2242abC8bb4BB78D537A67a245A7bEC64"
      - name: CircleCctpTokenMessengerV2
        address: "0x28b5a0e9C621a5BadaA536219b3a228C8168cf5d"
      - name: CircleCctpMessageTransmitterV2
        address: "0x81D40F21F12A8F0E3252Bccb954D722d4c464B64"
      - name: UniswapV3Factory
        address: "0x33128a8fC17869897dcE68Ed026d694621f6FDfD"
      - name: PancakeSwapV3Factory
        address: "0x0BFbCF9fa4f9C56B0F40a671Ad40E0805A091865"
      - name: AerodromePoolFactory
        address: "0x420DD381b31aEf6683db6B902084cB0FFECe40Da"
      - name: AerodromeSlipstreamFactory
        address: "0x5e7BB104d84C7CB9b682AAC2F3D509f5F406809A"
      - name: AerodromeSlipstream3Factory
        address: "0xf8f2eB4940CFE7d13603DDDD87f123820Fc061Ef"
      - name: AerodromeSlipstreamPoolFactory
        address: "0xeC8E5342B19977B4eF8892e02D8DAEcfa1315831"
      - name: MetaMorphoVaultFactory
        address: "0xA9c3D3a366466Fa809d1Ae982Fb2c46E5fC41101"
